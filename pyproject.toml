[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfshuttle"
version = "0.1.6"
description = "A self-hosted ebook and audiobook intake manager."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "cryptography>=44,<50",
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.121,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1.6,<4",
    "mutagen>=1.47,<2",
    "pillow>=12.1.1,<14",
    "python-multipart>=0.0.22,<1",
    "sqlalchemy>=2.0.40,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
