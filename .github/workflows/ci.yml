name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start an isolated Compose deployment
        run: |
          umask 077
          cp .env.example .env
          docker compose up --detach --build --wait --wait-timeout 90
      - name: Check health, volume access, and network exposure
        run: |
          test "$(docker inspect -f '{{len .HostConfig.PortBindings}}' "$(docker compose ps -q shelfshuttle)")" = 0
          docker compose exec -T shelfshuttle python -c 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=4).status == 200'
          docker compose exec -T shelfshuttle python -c 'import os; assert os.getuid() != 0; assert all(os.access(p, os.W_OK) for p in ("/app/data", "/app/intake", "/media/audiobooks", "/media/ebooks"))'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
