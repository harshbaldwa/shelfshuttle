name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    env:
      SHELFSHUTTLE_IMAGE: shelfshuttle:ci
      SHELFSHUTTLE_PROXY_NETWORK: shelfshuttle-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start an isolated Compose deployment
        run: |
          test ! -e .env
          test ! -e ./data
          mkdir -p media/media/books/{books,audiobooks} media/downloads/shelfshuttle
          sudo chown 1000:1000 media/media/books/{books,audiobooks}
          docker network create "$SHELFSHUTTLE_PROXY_NETWORK"
          docker build --tag "$SHELFSHUTTLE_IMAGE" .
          docker compose up --detach --pull never --wait --wait-timeout 90
      - name: Check runtime privileges and import into the default mounts
        run: |
          test "$(docker compose config --services)" = shelfshuttle
          test "$(docker inspect -f '{{len .HostConfig.PortBindings}}' "$(docker compose ps -q shelfshuttle)")" = 0
          docker compose exec --user 1000:1000 -T shelfshuttle python - < tests/smoke_container.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-latest
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
