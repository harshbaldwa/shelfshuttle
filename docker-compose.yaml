networks:
  frontend:
    external: true
    name: "${SHELFSHUTTLE_PROXY_NETWORK:-frontend}"

services:
  shelfshuttle:
    image: ${SHELFSHUTTLE_IMAGE:-ghcr.io/harshbaldwa/shelfshuttle:latest}
    networks:
      - frontend
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      SHELFSHUTTLE_QBIT_URL: "${SHELFSHUTTLE_QBIT_URL:-}"
      SHELFSHUTTLE_REMOTE_DOWNLOAD_ROOT: "${SHELFSHUTTLE_REMOTE_DOWNLOAD_ROOT:-/downloads}"
    volumes:
      - ./data:/app/data
      - ${EXT_VOL:-.}/media/downloads/books:/app/intake
      - ${EXT_VOL:-.}/media/downloads/shelfshuttle:/downloads:ro
      - ${EXT_VOL:-.}/media/media/books/books:/media/books/books
      - ${EXT_VOL:-.}/media/media/books/audiobooks:/media/books/audiobooks
    labels:
      - traefik.enable=${SHELFSHUTTLE_TRAEFIK_ENABLE:-false}
      - traefik.http.routers.shelfshuttle.rule=Host(`books.${DOMAIN_SUFFIX:-example.test}`)
      - traefik.http.routers.shelfshuttle.entrypoints=websecure
      - traefik.http.routers.shelfshuttle.service=shelfshuttle
      - traefik.http.routers.shelfshuttle.middlewares=${SHELFSHUTTLE_TRAEFIK_MIDDLEWARE:-shelfshuttle-auth@file}
      - traefik.http.services.shelfshuttle.loadbalancer.server.port=8080
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=640m,mode=1777
